<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 48" width="224" height="48" role="img" aria-label="OOO-Pilot">
  <defs>
    <linearGradient id="ooo-tile-light" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F7CF7"/>
      <stop offset="1" stop-color="#1E4FD0"/>
    </linearGradient>
  </defs>
  <g transform="scale(0.75)">
    <rect width="64" height="64" rx="15" fill="url(#ooo-tile-light)"/>
    <circle cx="32" cy="32" r="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"
            stroke-width="3.5" stroke-linecap="round"
            stroke-dasharray="74.8 32" transform="rotate(54 32 32)"/>
    <circle cx="32" cy="32" r="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3.5"/>
    <circle cx="32" cy="32" r="4" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark is live text. Convert to outlines before sending to print or a third party. -->
