<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OOO-Pilot — Admin Console</title>
<style>
  :root {
    --bg: #0a0d12; --panel: #12161d; --panel-2: #161b24; --line: #232a36;
    --text: #e6eaf2; --muted: #8691a8; --dim: #5b6478;
    --accent: #4ade80; --accent-dim: #16391f;
    --blue: #60a5fa; --amber: #fbbf24; --red: #f87171; --violet: #c4b5fd;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 20px 40px; background: var(--bg); color: var(--text);
    font: 13.5px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 10px; margin-bottom: 18px;
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  h1 .dim { color: var(--dim); font-weight: 400; }
  .live { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .live .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(74,222,128,.5); animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,.5); }
    70% { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  .stat-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (max-width: 900px) { .stat-row { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px;
  }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 19px; font-weight: 600; margin-top: 2px; }
  .stat .value.ok { color: var(--accent); }
  .stat .value.off { color: var(--dim); }

  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px; overflow: hidden;
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between;
  }
  .card h2 .count { color: var(--dim); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
    padding: 3px 9px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted);
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .badge.on { color: var(--accent); border-color: #1f5130; background: var(--accent-dim); }
  .badge.on .dot { background: var(--accent); }
  .badge.warn { color: var(--amber); border-color: #4a3410; }
  .badge.warn .dot { background: var(--amber); }

  #log {
    font-family: var(--mono); font-size: 12px; line-height: 1.65;
    height: 360px; overflow-y: auto; background: #07090d; border-radius: 8px;
    padding: 10px 12px; border: 1px solid var(--line);
  }
  .log-line { white-space: pre-wrap; word-break: break-word; }
  .log-line .t { color: var(--dim); margin-right: 8px; }
  .log-line.call { color: var(--blue); }
  .log-line.warn { color: var(--amber); }
  .log-line.error { color: var(--red); }
  .log-line.info { color: var(--text); }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px;
       text-transform: uppercase; letter-spacing: .03em; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 6px; border-bottom: 1px solid #1a1f29; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--panel-2); }
  .mono { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10.5px; font-weight: 600; }
  .pill.completed { background: var(--accent-dim); color: var(--accent); }
  .pill.in_progress, .pill.pending, .pill.calling_back, .pill.received { background: #1a2a40; color: var(--blue); }
  .pill.failed, .pill.rejected { background: #3a1a1a; color: var(--red); }
  .pill.high { background: #3a2a10; color: var(--amber); }
  .pill.inbound { background: #2a1f3a; color: var(--violet); }
  .empty { color: var(--dim); padding: 14px 0; text-align: center; font-style: italic; }

  .conv-detail {
    display: none; padding: 10px 8px 4px; background: #0d1119; border-radius: 8px; margin: 2px 0 8px;
  }
  .conv-detail.open { display: block; }
  .conv-detail .summary { color: var(--muted); margin-bottom: 8px; font-size: 12.5px; }
  .conv-detail .item { margin: 3px 0; font-size: 12px; }
  .conv-detail .item .tag {
    font-family: var(--mono); font-size: 10px; color: var(--dim); margin-right: 6px;
    display: inline-block; width: 90px;
  }
  .disc-box {
    border: 1px solid #4a3410; background: #1a1407; border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; color: #fcd34d; margin-top: 8px;
  }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 980px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OOO-Pilot <span class="dim">/ admin console</span></h1>
    <div class="live"><span class="pulse"></span> live — polling localhost</div>
  </header>

  <div class="stat-row" id="stats">
    <div class="stat"><div class="label">Employee</div><div class="value" id="s-employee">—</div></div>
    <div class="stat"><div class="label">OOO status</div><div class="value" id="s-ooo">—</div></div>
    <div class="stat"><div class="label">Project</div><div class="value" id="s-project">—</div></div>
    <div class="stat"><div class="label">Conversations</div><div class="value" id="s-conv">0</div></div>
    <div class="stat"><div class="label">Open follow-ups</div><div class="value" id="s-fu">0</div></div>
    <div class="stat"><div class="label">Knowledge items</div><div class="value" id="s-kn">0</div></div>
  </div>

  <div class="card">
    <h2>Integrations</h2>
    <div class="badges" id="badges"></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Live activity log <span class="count" id="log-count"></span></h2>
        <div id="log"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Conversations <span class="count" id="conv-count"></span></h2>
        <div id="conversations"><div class="empty">No conversations yet.</div></div>
      </div>

      <div class="card">
        <h2>Open follow-ups <span class="count" id="fu-count"></span></h2>
        <div id="followups"><div class="empty">Nothing pending.</div></div>
      </div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let lastLogId = 0;
  let expandedConv = null;

  async function getJSON(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error(res.status + " " + path);
    return res.json();
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  function esc(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function pill(status) {
    const cls = String(status ?? "").toLowerCase();
    return `<span class="pill ${cls}">${esc(status)}</span>`;
  }

  // ---------- badges + stats ----------
  async function refreshOverview() {
    const o = await getJSON("/admin/overview");
    $("s-employee").textContent = o.employee.name;
    $("s-ooo").innerHTML = o.ooo.enabled
      ? `<span style="color:var(--accent)">● OOO</span>`
      : `<span style="color:var(--dim)">idle</span>`;
    $("s-project").textContent = o.project?.name ?? "—";
    $("s-conv").textContent = o.counts.conversations;
    $("s-fu").textContent = o.counts.openFollowups;
    $("s-kn").textContent = o.counts.knowledgeItems;

    const b = (label, on, extra = "") =>
      `<span class="badge ${on ? "on" : extra}"><span class="dot"></span>${label}</span>`;
    $("badges").innerHTML = [
      b("Slack", o.integrations.slack),
      b("Jira", o.integrations.jira),
      b(o.integrations.calleDryRun ? "CALL-E (dry run)" : "CALL-E", o.integrations.calle, o.integrations.calleDryRun ? "warn" : ""),
      b("LLM fallback", o.integrations.llm),
    ].join("");
  }

  // ---------- log ----------
  function appendLog(entries) {
    if (!entries.length) return;
    const el = $("log");
    const wasAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
    for (const e of entries) {
      const row = document.createElement("div");
      row.className = "log-line " + e.level;
      row.innerHTML = `<span class="t">${fmtTime(e.ts)}</span>${esc(e.message)}`;
      el.appendChild(row);
      lastLogId = e.id;
    }
    while (el.children.length > 400) el.removeChild(el.firstChild);
    if (wasAtBottom) el.scrollTop = el.scrollHeight;
    $("log-count").textContent = `(${el.children.length})`;
  }
  async function refreshLog() {
    const entries = await getJSON(`/logs?after=${lastLogId}`);
    appendLog(entries);
  }

  // ---------- conversations ----------
  const ITEM_LABELS = {
    QUESTION: "question", ANSWER: "answer", NEW_INFORMATION: "new info",
    FOLLOW_UP: "follow-up", COMMITMENT: "commitment", DECISION: "decision", UNRESOLVED: "unresolved",
  };

  async function toggleConversation(id, rowEl) {
    const existing = document.getElementById(`detail-${id}`);
    if (existing) {
      existing.remove();
      expandedConv = expandedConv === id ? null : expandedConv;
      return;
    }
    // Collapse any other open detail.
    document.querySelectorAll(".conv-detail").forEach((n) => n.remove());
    expandedConv = id;

    const data = await getJSON(`/conversations/${id}`);
    const box = document.createElement("div");
    box.className = "conv-detail open";
    box.id = `detail-${id}`;
    box.innerHTML =
      `<div class="summary">${esc(data.conversation.summary ?? "No summary yet.")}</div>` +
      data.items.map((i) =>
        `<div class="item"><span class="tag">${ITEM_LABELS[i.type] ?? i.type}</span>${esc(i.content)}${i.source ? ` <span class="mono">— ${esc(i.source)}</span>` : ""}</div>`
      ).join("");
    rowEl.after(box);
  }

  async function refreshConversations() {
    const list = await getJSON("/conversations");
    const el = $("conversations");
    $("conv-count").textContent = `(${list.length})`;
    if (!list.length) { el.innerHTML = '<div class="empty">No conversations yet.</div>'; return; }

    const table = document.createElement("table");
    table.innerHTML =
      "<tr><th>Requester</th><th>Topic</th><th>Status</th><th>Started</th></tr>" +
      list.map((c) =>
        `<tr class="clickable" data-id="${c.id}">` +
          `<td>${esc(c.requester)}${c.direction === "INBOUND_CALLBACK" ? ' <span class="pill inbound">inbound</span>' : ""}</td>` +
          `<td>${esc(c.topic)}</td>` +
          `<td>${pill(c.status)}</td>` +
          `<td class="mono">${fmtTime(c.started_at)}</td>` +
        "</tr>"
      ).join("");
    el.innerHTML = "";
    el.appendChild(table);
    table.querySelectorAll("tr.clickable").forEach((row) => {
      row.addEventListener("click", () => toggleConversation(row.dataset.id, row));
    });
  }

  // ---------- follow-ups ----------
  async function refreshFollowups() {
    const list = await getJSON("/followups");
    const el = $("followups");
    $("fu-count").textContent = `(${list.length})`;
    if (!list.length) { el.innerHTML = '<div class="empty">Nothing pending.</div>'; return; }

    const table = document.createElement("table");
    table.innerHTML =
      "<tr><th>Content</th><th>From</th><th>Priority</th></tr>" +
      list.map((f) =>
        `<tr><td>${esc(f.content)}</td><td class="mono">${esc(f.requester ?? "—")}</td><td>${pill(f.priority)}</td></tr>`
      ).join("");
    el.innerHTML = "";
    el.appendChild(table);
  }

  async function tick() {
    try {
      await Promise.all([refreshOverview(), refreshLog(), refreshConversations(), refreshFollowups()]);
    } catch (err) {
      console.warn("admin console refresh failed:", err);
    }
  }

  tick();
  setInterval(refreshOverview, 4000);
  setInterval(refreshLog, 1500);
  setInterval(refreshConversations, 3000);
  setInterval(refreshFollowups, 4000);
</script>
</body>
</html>
