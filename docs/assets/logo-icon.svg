<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OOO-Pilot">
  <defs>
    <linearGradient id="ooo-tile" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F7CF7"/>
      <stop offset="1" stop-color="#1E4FD0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#ooo-tile)"/>
  <!-- outer ring: broken on the right - the absence, and the call going out through it -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"
          stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="74.8 32" transform="rotate(54 32 32)"/>
  <!-- closed ring: the verified context -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3.5"/>
  <!-- core: the request -->
  <circle cx="32" cy="32" r="4" fill="#FFFFFF"/>
</svg>
